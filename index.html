<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ini &amp; Oba — Street Racing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#070a0f;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e9eff8}
  #game{display:block;width:100vw;height:100vh}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:10;
    background:radial-gradient(circle at 50% 35%,rgba(24,32,48,.94),rgba(5,7,11,.985))}
  .hidden{display:none!important}
  .card{width:min(720px,94vw);border:1px solid rgba(120,170,255,.18);
    background:linear-gradient(180deg,rgba(19,26,40,.92),rgba(11,15,24,.95));
    border-radius:22px;padding:34px 34px 28px;text-align:center;
    box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
  h1{font-size:clamp(38px,7vw,66px);font-weight:900;letter-spacing:6px;line-height:1;
    background:linear-gradient(90deg,#5ec8ff,#c58bff 55%,#ff7a59);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 24px rgba(90,160,255,.35))}
  h1 span{opacity:.55;font-weight:400}
  .sub{margin-top:8px;font-size:clamp(12px,2vw,16px);letter-spacing:8px;color:#7d8aa5;font-weight:700}
  .hint{margin:22px 0 14px;color:#9fb0cc;font-size:14px;letter-spacing:1px}
  .chars{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .char{flex:1 1 220px;max-width:290px;cursor:pointer;border-radius:16px;padding:20px 16px;
    border:1px solid rgba(130,175,255,.16);background:rgba(255,255,255,.03);color:inherit;
    font-family:inherit;text-align:center;transition:transform .15s,border-color .15s,background .15s}
  .char:hover{transform:translateY(-4px);background:rgba(255,255,255,.06);border-color:rgba(130,175,255,.4)}
  .char.sel{border-color:#7fd4ff;background:rgba(90,170,255,.12);
    box-shadow:0 0 0 1px #7fd4ff,0 12px 40px rgba(60,140,255,.3)}
  .avatar{width:86px;height:86px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;
    justify-content:center;font-size:40px;font-weight:900;color:#08111c;position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .avatar::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
  .cname{font-size:22px;font-weight:800;letter-spacing:3px}
  .ctag{font-size:11px;letter-spacing:2px;color:#8b9ab8;margin-top:3px;text-transform:uppercase}
  .stats{margin-top:14px;display:grid;gap:7px}
  .stat{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1px;color:#9fb0cc}
  .stat b{width:64px;text-align:left;font-weight:600}
  .bar{flex:1;height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#5ec8ff,#c58bff)}
  .btn{margin-top:24px;cursor:pointer;font-family:inherit;font-weight:800;letter-spacing:2px;
    font-size:15px;padding:14px 40px;border-radius:12px;border:0;color:#04121f;
    background:linear-gradient(90deg,#63d0ff,#9a7bff);transition:transform .12s,filter .12s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .controls{margin-top:20px;color:#6f7d97;font-size:12px;letter-spacing:1px;line-height:1.9}
  kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:5px;
    padding:1px 7px;font-family:inherit;font-size:11px;color:#c9d6ea}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .panel{position:absolute;background:rgba(10,14,22,.62);border:1px solid rgba(130,175,255,.16);
    border-radius:14px;backdrop-filter:blur(6px)}
  #pcard{top:16px;left:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;min-width:220px}
  #pcard .av{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:20px;color:#08111c;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #pname{font-weight:800;letter-spacing:2px;font-size:15px}
  #ppos{font-size:11px;letter-spacing:1px;color:#8fa2c4}
  #speedbox{bottom:20px;left:16px;padding:12px 16px 12px;min-width:170px}
  #spd{font-size:36px;font-weight:900;letter-spacing:1px;line-height:1}
  #spd small{font-size:12px;color:#8fa2c4;letter-spacing:2px;font-weight:600}
  #gear{font-size:11px;letter-spacing:2px;color:#8fa2c4;margin-top:4px}
  #sbar{margin-top:8px;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
  #sbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#42e08a,#ffd166 55%,#ff5f6d)}
  #laps{top:16px;right:16px;padding:12px 16px;text-align:right;min-width:140px}
  #laps .big{font-size:22px;font-weight:900;letter-spacing:2px}
  #laps .lbl{font-size:10px;letter-spacing:2px;color:#8fa2c4}
  #time{font-size:13px;font-weight:700;letter-spacing:2px;color:#9fd0ff;margin-top:4px}
  #cpmax{bottom:20px;right:16px;padding:8px 14px;font-size:12px;letter-spacing:1px}
  #minimap{top:78px;right:16px;border-radius:12px;
    border:1px solid rgba(130,175,255,.2);background:rgba(8,11,18,.7);box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #center{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
    font-size:clamp(50px,12vw,120px);font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 8px 40px rgba(90,160,255,.6);z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
  #mute{top:90px;left:16px;position:absolute;pointer-events:auto;cursor:pointer;
    padding:8px 14px;font-family:inherit;font-size:12px;letter-spacing:1px;color:#c9d6ea;
    background:rgba(10,14,22,.62);border:1px solid rgba(130,175,255,.16);border-radius:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="center"></div>
<div id="hud" class="hidden">
  <div id="pcard" class="panel">
    <div class="av" id="pav">I</div>
    <div><div id="pname">INI</div><div id="ppos">POSITION 1 / 2</div></div>
  </div>
  <button id="mute">🔊 SOUND</button>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="laps" class="panel">
    <div class="lbl">LAP</div>
    <div class="big"><span id="lapl">1</span>/3</div>
    <div id="time">00:00.000</div>
  </div>
  <div id="speedbox" class="panel">
    <div id="spd">0<small> KM/H</small></div>
    <div id="gear">GEAR 1</div>
    <div id="sbar"><i></i></div>
  </div>
  <div id="cpmax" class="panel">CHECKPOINT <span id="cp">1/8</span></div>
</div>
<div id="menu" class="overlay">
  <div class="card">
    <h1>INI <span>&amp;</span> OBA</h1>
    <div class="sub">STREET RACING</div>
    <div class="hint">CHOOSE YOUR DRIVER</div>
    <div class="chars">
      <button class="char" data-char="ini">
        <div class="avatar" style="background:linear-gradient(135deg,#5fd0ff,#7b7bff)">I</div>
        <div class="cname">INI</div>
        <div class="ctag">The Technician</div>
        <div class="stats">
          <div class="stat"><b>SPEED</b><div class="bar"><i style="width:72%"></i></div></div>
          <div class="stat"><b>HANDLING</b><div class="bar"><i style="width:95%"></i></div></div>
          <div class="stat"><b>GRIP</b><div class="bar"><i style="width:90%"></i></div></div>
        </div>
      </button>
      <button class="char" data-char="oba">
        <div class="avatar" style="background:linear-gradient(135deg,#ff9a5f,#ff5f8f)">O</div>
        <div class="cname">OBA</div>
        <div class="ctag">The King</div>
        <div class="stats">
          <div class="stat"><b>SPEED</b><div class="bar"><i style="width:95%"></i></div></div>
          <div class="stat"><b>HANDLING</b><div class="bar"><i style="width:74%"></i></div></div>
          <div class="stat"><b>GRIP</b><div class="bar"><i style="width:80%"></i></div></div>
        </div>
      </button>
    </div>
    <button class="btn" id="start">START ENGINE</button>
    <div class="controls"><kbd>W</kbd> throttle · <kbd>S</kbd> brake / reverse · <kbd>A</kbd> <kbd>D</kbd> steer · <kbd>R</kbd> restart · <kbd>M</kbd> mute</div>
  </div>
</div>
<div id="results" class="overlay hidden">
  <div class="card">
    <div class="sub" id="rsub">RACE COMPLETE</div>
    <h1 id="rtitle">YOU WIN</h1>
    <div class="hint" id="rtime"></div>
    <button class="btn" id="again">RACE AGAIN</button>
    <div class="controls"><kbd>R</kbd> restart</div>
  </div>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,vignette=null;
const DPR=Math.min(2,devicePixelRatio||1);
function resize(){
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.34,W/2,H/2,Math.max(W,H)*0.72);
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(0,0,0,0.55)');
}
addEventListener('resize',resize);resize();

const TILE=440, ROADW=160, GN=8, MARGIN=ROADW/2+4;
const WORLD=GN*TILE+ROADW;
const RC=i=>ROADW/2+i*TILE;
const CPS=[[1,1],[5,1],[7,1],[7,5],[7,7],[3,7],[1,7],[1,3]].map(([i,j])=>({x:RC(i),y:RC(j)}));
const LAPS=3;

let buildings=[], trees=[], lamps=[];
const isPark=(i,j)=>((i*7+j*13)%5===0);
function genCity(){
  buildings=[];trees=[];lamps=[];
  const gap=16, cell=(TILE-ROADW-36-gap)/2;
  for(let i=0;i<GN;i++)for(let j=0;j<GN;j++){
    const bx=i*TILE+ROADW, by=j*TILE+ROADW, s=TILE-ROADW;
    if(isPark(i,j)){
      const n=4+Math.floor(Math.random()*4);
      for(let t=0;t<n;t++){
        const tx=bx+34+Math.random()*(s-68), ty=by+34+Math.random()*(s-68);
        trees.push({x:tx,y:ty,r:15+Math.random()*10});
      }
    } else {
      const ox=bx+18, oy=by+18;
      for(let a=0;a<2;a++)for(let b=0;b<2;b++){
        if(Math.random()<0.16) continue;
        const w=cell*(0.86+Math.random()*0.14), h=cell*(0.86+Math.random()*0.14);
        buildings.push({x:ox+a*(cell+gap),y:oy+b*(cell+gap),w,h,
          hue:205+Math.random()*70,shade:Math.random()});
      }
    }
    lamps.push({x:bx+12,y:by+12},{x:bx+s-12,y:by+12},{x:bx+12,y:by+s-12},{x:bx+s-12,y:by+s-12});
  }
}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r+255*amt)));
  g=Math.max(0,Math.min(255,Math.round(g+255*amt)));
  b=Math.max(0,Math.min(255,Math.round(b+255*amt)));
  return `rgb(${r},${g},${b})`;
}

class Car{
  constructor(name,color,o){
    this.name=name;this.color=color;
    this.x=o.x;this.y=o.y;this.angle=o.angle||0;
    this.vx=0;this.vy=0;
    this.maxSpeed=o.maxSpeed;this.accel=o.accel;this.brake=o.brake;
    this.grip=o.grip;this.turn=o.turn;
    this.w=52;this.h=27;
    this.lap=0;this.cp=1;this.finished=false;this.place=1;
    this.hit=0;this.skid=false;this.braking=false;this.isPlayer=!!o.player;
    this.exhaust=0;
  }
  fwd(){return {x:Math.cos(this.angle),y:Math.sin(this.angle)};}
  update(dt,th,steer){
    const f=this.fwd();
    let fs=this.vx*f.x+this.vy*f.y;
    const lat={x:this.vx-f.x*fs,y:this.vy-f.y*fs};
    const g=Math.pow(this.grip,dt*60);
    lat.x*=g;lat.y*=g;
    if(th>0) fs+=th*this.accel*dt;
    else if(th<0) fs+=th*this.brake*dt;
    fs-=fs*0.55*dt;
    if(th===0&&Math.abs(fs)<4) fs=0;
    fs=Math.max(-this.maxSpeed*0.45,Math.min(this.maxSpeed,fs));
    const sp=Math.abs(fs);
    if(sp>6) this.angle+=steer*this.turn*Math.min(1,sp/(this.maxSpeed*0.55))*dt*Math.sign(fs);
    const f2=this.fwd();
    this.vx=f2.x*fs+lat.x;this.vy=f2.y*fs+lat.y;
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.skid=(Math.abs(lat.x)+Math.abs(lat.y))>95 && sp>120;
    this.braking=th<0;
    this.exhaust=(th>0?1:0);
    if(this.hit>0)this.hit-=dt*3;
    this.x=Math.max(MARGIN,Math.min(WORLD-MARGIN,this.x));
    this.y=Math.max(MARGIN,Math.min(WORLD-MARGIN,this.y));
  }
  kmh(){return Math.round(Math.hypot(this.vx,this.vy)*0.42);}
}

function collideCar(car){
  const r=18; let hit=false;
  const x0=car.x-150,x1=car.x+150,y0=car.y-150,y1=car.y+150;
  for(const b of buildings){
    if(b.x>x1||b.x+b.w<x0||b.y>y1||b.y+b.h<y0) continue;
    const cx=Math.max(b.x,Math.min(car.x,b.x+b.w));
    const cy=Math.max(b.y,Math.min(car.y,b.y+b.h));
    let dx=car.x-cx,dy=car.y-cy,d=Math.hypot(dx,dy);
    if(d<r){
      if(d<0.0001){dx=1;dy=0;d=1;}
      const nx=dx/d,ny=dy/d;
      car.x+=nx*(r-d);car.y+=ny*(r-d);
      const vn=car.vx*nx+car.vy*ny;
      if(vn<0){car.vx-=vn*nx*1.5;car.vy-=vn*ny*1.5;hit=true;}
    }
  }
  if(hit)car.hit=1;
  return hit;
}

const skids=[], sparks=[], smoke=[];
function addSkid(c){
  if(!c.skid)return;
  skids.push({x:c.x,y:c.y,a:c.angle});
  if(skids.length>1600) skids.splice(0,500);
}
function addSparks(x,y,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*170;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:Math.random()<0.5?'#ffd27a':'#fff'});}
}
function addSmoke(c){
  if(!c.exhaust)return;
  const b={x:c.x-Math.cos(c.angle)*c.w/2,y:c.y-Math.sin(c.angle)*c.w/2};
  smoke.push({x:b.x,y:b.y,r:4+Math.random()*3,life:1});
  if(smoke.length>400)smoke.splice(0,100);
}
function updParticles(dt){
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.93;p.vy*=0.93;p.life-=dt*1.8;
    if(p.life<=0)sparks.splice(i,1);}
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];
    p.r+=dt*22;p.y-=dt*10;p.life-=dt*0.9;
    if(p.life<=0)smoke.splice(i,1);}
}

const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='r') startRace();
  if(k==='m') toggleMute();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function throttleInput(){let t=0;if(keys['w']||keys['arrowup'])t+=1;if(keys['s']||keys['arrowdown'])t-=1;return t;}
function steerInput(){let s=0;if(keys['a']||keys['arrowleft'])s-=1;if(keys['d']||keys['arrowright'])s+=1;return s;}

const menu=document.getElementById('menu');
const hud=document.getElementById('hud');
const results=document.getElementById('results');
const center=document.getElementById('center');

let player=null,ai=null,all=[],running=false,raceOver=false;
let chosen='ini',startTime=0,finishedTime=0,countdown=0;
let cam={x:0,y:0,scale:1};
let VX0=0,VY0=0,VX1=0,VY1=0;

const CHARS={
  ini:{name:'INI',color:'#3fb6ff',maxSpeed:470,accel:560,brake:860,grip:0.90,turn:3.5},
  oba:{name:'OBA',color:'#ff7a4d',maxSpeed:535,accel:520,brake:820,grip:0.83,turn:3.0}
};
function baseScale(){return Math.max(0.6,Math.min(1.0,Math.min(W,H)/880));}

function makeCars(){
  const s0=CPS[0],s1=CPS[1];
  const ang=Math.atan2(s1.y-s0.y,s1.x-s0.x);
  const off={x:Math.cos(ang+Math.PI/2)*26,y:Math.sin(ang+Math.PI/2)*26};
  const bx=s0.x-Math.cos(ang)*135, by=s0.y-Math.sin(ang)*135;
  const other=chosen==='ini'?'oba':'ini';
  const pc=CHARS[chosen], ac=CHARS[other];
  player=new Car(pc.name,pc.color,{...pc,x:bx+off.x,y:by+off.y,angle:ang,player:true});
  ai=new Car(ac.name,ac.color,{...ac,x:bx-off.x,y:by-off.y,angle:ang});
  all=[player,ai];
  const pav=document.getElementById('pav');
  pav.textContent=pc.name[0];pav.style.background=pc.color;
  document.getElementById('pname').textContent=pc.name;
}

function startRace(){
  menu.classList.add('hidden');
  results.classList.add('hidden');
  hud.classList.remove('hidden');
  genCity();makeCars();
  skids.length=0;sparks.length=0;smoke.length=0;
  cam={x:player.x,y:player.y,scale:baseScale()};
  running=true;raceOver=false;countdown=3.0;finishedTime=0;
  startTime=performance.now();
  audioStart();
}

function showCount(){
  let t;
  if(countdown>2)t='3';else if(countdown>1)t='2';else if(countdown>0)t='1';
  else if(countdown>-0.9)t='GO!';else{center.style.opacity=0;return;}
  center.textContent=t;center.style.opacity=1;
}

function checkProgress(c){
  if(c.finished)return;
  const t=CPS[c.cp];
  if(Math.hypot(c.x-t.x,c.y-t.y)<95){
    if(c.cp===0){c.lap++;if(c.lap>=LAPS)c.finished=true;c.cp=1;}
    else c.cp=(c.cp+1)%CPS.length;
  }
}
function progressOf(c){
  const idx=c.cp===0?CPS.length:c.cp;
  const t=CPS[c.cp];
  const d=Math.hypot(c.x-t.x,c.y-t.y);
  return c.lap*CPS.length+idx-d/4000;
}
function updatePositions(){
  const arr=all.slice().sort((a,b)=>progressOf(b)-progressOf(a));
  arr.forEach((c,i)=>c.place=i+1);
}
function aiControl(){
  const t=CPS[ai.cp];
  let diff=Math.atan2(t.y-ai.y,t.x-ai.x)-ai.angle;
  while(diff>Math.PI)diff-=6.28318;
  while(diff<-Math.PI)diff+=6.28318;
  const steer=Math.max(-1,Math.min(1,diff*2.2));
  let th=1;
  if(Math.abs(diff)>0.9)th=0.55;
  const sp=Math.hypot(ai.vx,ai.vy);
  if(Math.abs(diff)>1.6&&sp>260)th=-0.4;
  return {th,steer};
}
function endRace(){
  running=false;
  const win=player.place===1;
  document.getElementById('rsub').textContent=win?'🏁 VICTORY':'🏁 RACE COMPLETE';
  document.getElementById('rtitle').textContent=win?'YOU WIN':'YOU LOSE';
  document.getElementById('rtime').textContent=player.name+' · '+fmt(finishedTime)+' · P'+player.place;
  results.classList.remove('hidden');
}

let actx=null,oscA=null,gainA=null,engineOn=false,muted=false;
function audioStart(){
  if(muted)return;
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;}
  if(!actx)return;
  if(!oscA){
    oscA=actx.createOscillator();gainA=actx.createGain();
    oscA.type='sawtooth';oscA.frequency.value=60;gainA.gain.value=0;
    const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=760;
    oscA.connect(lp);lp.connect(gainA);gainA.connect(actx.destination);oscA.start();
  }
  engineOn=true;
  if(actx.state==='suspended')actx.resume();
}
function audioUpdate(){
  if(!engineOn||!oscA||!player||muted)return;
  const k=player.kmh();
  oscA.frequency.value=55+k*1.7;
  gainA.gain.value=0.018+Math.min(0.05,k/5000);
}
function toggleMute(){
  muted=!muted;
  document.getElementById('mute').textContent=muted?'🔇 MUTED':'🔊 SOUND';
  if(gainA)gainA.gain.value=muted?0:(engineOn?0.03:0);
}

function updateCamera(dt){
  if(!player)return;
  const k=1-Math.pow(0.0016,dt);
  const lx=player.x+player.vx*0.28, ly=player.y+player.vy*0.28;
  cam.x+=(lx-cam.x)*k;cam.y+=(ly-cam.y)*k;
  const sp=Math.hypot(player.vx,player.vy);
  const ts=baseScale()*(1-Math.min(0.14,sp/6000));
  cam.scale+=(ts-cam.scale)*k;
}

function render(){
  ctx.fillStyle='#0a0d13';ctx.fillRect(0,0,W,H);
  if(!player)return;
  const hw=W/2/cam.scale,hh=H/2/cam.scale;
  VX0=cam.x-hw;VX1=cam.x+hw;VY0=cam.y-hh;VY1=cam.y+hh;
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(cam.scale,cam.scale);ctx.translate(-cam.x,-cam.y);
  drawGround();drawProps();drawBuildings();
  drawSkids();drawCheckpoints();
  for(const c of all)drawCar(c);
  drawSmoke();drawSparks();
  ctx.restore();
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  drawArrow();
}

function drawGround(){
  ctx.fillStyle='#20242b';ctx.fillRect(VX0,VY0,VX1-VX0,VY1-VY0);
  for(let i=0;i<GN;i++)for(let j=0;j<GN;j++){
    const x=i*TILE+ROADW,y=j*TILE+ROADW,s=TILE-ROADW;
    if(x+s<VX0||x>VX1||y+s<VY0||y>VY1)continue;
    ctx.fillStyle='#454b56';ctx.fillRect(x,y,s,s);
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(x,y,s,5);
    if(isPark(i,j)){
      ctx.fillStyle='#2b4a33';ctx.fillRect(x+16,y+16,s-32,s-32);
      ctx.fillStyle='rgba(0,0,0,0.10)';
      for(let k=0;k<26;k++){const rx=x+20+((k*97)%(s-40)),ry=y+20+((k*53)%(s-40));
        ctx.fillRect(rx,ry,3,3);}
    } else {
      ctx.fillStyle='#343a45';ctx.fillRect(x+16,y+16,s-32,s-32);
    }
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=2;
    ctx.strokeRect(x+16,y+16,s-32,s-32);
  }
  ctx.save();
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(230,230,230,0.35)';ctx.lineWidth=3;
  for(let i=0;i<=GN;i++){
    const x=RC(i);
    ctx.beginPath();ctx.moveTo(x,VY0);ctx.lineTo(x,VY1);ctx.stroke();
    const y=RC(i);
    ctx.beginPath();ctx.moveTo(VX0,y);ctx.lineTo(VX1,y);ctx.stroke();
  }
  ctx.strokeStyle='rgba(240,205,90,0.65)';ctx.lineWidth=4;ctx.setLineDash([36,34]);
  for(let i=0;i<=GN;i++){
    const x=RC(i);
    ctx.beginPath();ctx.moveTo(x,VY0);ctx.lineTo(x,VY1);ctx.stroke();
    const y=RC(i);
    ctx.beginPath();ctx.moveTo(VX0,y);ctx.lineTo(VX1,y);ctx.stroke();
  }
  ctx.restore();
  for(let i=0;i<=GN;i++)for(let j=0;j<=GN;j++){
    const cx=RC(i),cy=RC(j);
    if(cx<VX0-ROADW||cx>VX1+ROADW||cy<VY0-ROADW||cy>VY1+ROADW)continue;
    crosswalks(cx,cy);
  }
}
function crosswalks(cx,cy){
  ctx.fillStyle='rgba(235,235,235,0.7)';
  const half=ROADW/2, bw=11, gap=9;
  for(let k=-half+8;k<half-8;k+=bw+gap){
    ctx.fillRect(cx+k,cy-half-18,bw,13);
    ctx.fillRect(cx+k,cy+half+5,bw,13);
    ctx.fillRect(cx-half-18,cy+k,13,bw);
    ctx.fillRect(cx+half+5,cy+k,13,bw);
  }
}

function drawProps(){
  for(const l of lamps){
    if(l.x<VX0||l.x>VX1||l.y<VY0||l.y>VY1)continue;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.arc(l.x+3,l.y+4,6,0,6.283);ctx.fill();
    ctx.fillStyle='#2b3037';ctx.beginPath();ctx.arc(l.x,l.y,5,0,6.283);ctx.fill();
    ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.arc(l.x,l.y,2.4,0,6.283);ctx.fill();
  }
  for(const t of trees){
    if(t.x<VX0||t.x>VX1||t.y<VY0||t.y>VY1)continue;
    ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(t.x+6,t.y+7,13,10,0,0,6.283);ctx.fill();
    ctx.fillStyle='#2c5a36';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,6.283);ctx.fill();
    ctx.fillStyle='#3d7a45';ctx.beginPath();ctx.arc(t.x-3,t.y-3,t.r*0.72,0,6.283);ctx.fill();
    ctx.fillStyle='#5aa05b';ctx.beginPath();ctx.arc(t.x-5,t.y-5,t.r*0.36,0,6.283);ctx.fill();
  }
}

function drawBuildings(){
  for(const b of buildings){
    if(b.x+b.w<VX0||b.x>VX1||b.y+b.h<VY0||b.y>VY1)continue;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(b.x+10,b.y+13,b.w,b.h);
    const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    g.addColorStop(0,`hsl(${b.hue},15%,${45+b.shade*10}%)`);
    g.addColorStop(1,`hsl(${b.hue},16%,${28+b.shade*8}%)`);
    ctx.fillStyle=g;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='rgba(255,255,255,0.09)';ctx.fillRect(b.x,b.y,b.w,7);
    const pad=8,gx=15,gy=15,ww=8,wh=8;
    for(let yy=b.y+pad; yy+wh<b.y+b.h-pad; yy+=gy){
      for(let xx=b.x+pad; xx+ww<b.x+b.w-pad; xx+=gx){
        const lit=(((xx*13+yy*7)|0)%21)===0;
        ctx.fillStyle=lit?'rgba(255,220,140,0.92)':'rgba(28,50,82,0.8)';
        ctx.fillRect(xx,yy,ww,wh);
      }
    }
    ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=2;ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
  }
}

function drawCar(c){
  ctx.save();
  ctx.translate(c.x,c.y);ctx.rotate(c.angle);
  ctx.fillStyle='rgba(0,0,0,0.42)';ctx.beginPath();
  ctx.roundRect(-c.w/2+3,-c.h/2+4,c.w,c.h,9);ctx.fill();
  ctx.fillStyle='#14171c';
  ctx.beginPath();ctx.roundRect(c.w/2-13,-c.h/2-3,11,7,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(c.w/2-13,c.h/2-4,11,7,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(-c.w/2+2,-c.h/2-3,11,7,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(-c.w/2+2,c.h/2-4,11,7,3);ctx.fill();
  const grd=ctx.createLinearGradient(0,-c.h/2,0,c.h/2);
  grd.addColorStop(0,shade(c.color,0.16));
  grd.addColorStop(0.5,c.color);
  grd.addColorStop(1,shade(c.color,-0.30));
  ctx.fillStyle=grd;ctx.beginPath();ctx.roundRect(-c.w/2,-c.h/2,c.w,c.h,9);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(-c.w/2,-c.h/2,c.w,c.h,9);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fillRect(-c.w/2+7,-2,c.w-24,4);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(-c.w/2+7,7,c.w-30,3);
  ctx.fillStyle='rgba(10,18,30,0.92)';
  ctx.beginPath();ctx.roundRect(c.w*0.14,-c.h/2+4,11,c.h-8,3);ctx.fill();
  ctx.fillStyle='rgba(18,28,44,0.75)';
  ctx.beginPath();ctx.roundRect(-c.w*0.32,-c.h/2+6,9,c.h-12,3);ctx.fill();
  ctx.fillStyle='#fff8cf';ctx.fillRect(c.w/2-5,-c.h/2+3,5,6);ctx.fillRect(c.w/2-5,c.h/2-9,5,6);
  if(c.braking||c.hit>0){
    ctx.fillStyle='#ff5252';ctx.shadowColor='#ff2d2d';ctx.shadowBlur=10;
    ctx.fillRect(-c.w/2,-c.h/2+2,6,8);ctx.fillRect(-c.w/2,c.h/2-10,6,8);
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle='#c22';ctx.fillRect(-c.w/2,-c.h/2+3,5,6);ctx.fillRect(-c.w/2,c.h/2-9,5,6);
  }
  ctx.restore();
}

function drawCheckpoints(){
  for(const a of all){
    if(a.finished)continue;
    const t=CPS[a.cp];
    ctx.save();ctx.translate(t.x,t.y);
    const col=a.isPlayer?'110,210,255':'255,140,90';
    ctx.fillStyle=`rgba(${col},0.10)`;
    ctx.beginPath();ctx.arc(0,0,80,0,6.283);ctx.fill();
    ctx.strokeStyle=`rgba(${col},0.85)`;ctx.lineWidth=6;ctx.setLineDash([12,10]);
    ctx.beginPath();ctx.arc(0,0,80,0,6.283);ctx.stroke();ctx.restore();
  }
  const s=CPS[0];
  ctx.save();ctx.translate(s.x,s.y);
  ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillRect(-ROADW/2,-9,ROADW,18);
  ctx.fillStyle='#111';
  for(let k=-ROADW/2;k<ROADW/2;k+=20)ctx.fillRect(k,-9,10,18);
  ctx.restore();
}

function drawSkids(){
  ctx.fillStyle='rgba(0,0,0,0.26)';
  for(const s of skids){
    if(s.x<VX0||s.x>VX1||s.y<VY0||s.y>VY1)continue;
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);
    ctx.fillRect(-3,-4,6,3);ctx.fillRect(-3,1,6,3);ctx.restore();
  }
}
function drawSmoke(){
  for(const p of smoke){
    ctx.globalAlpha=Math.max(0,p.life)*0.22;
    ctx.fillStyle='#c9d2e0';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawSparks(){
  for(const p of sparks){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}
function drawArrow(){
  if(!player||!running)return;
  const t=CPS[player.cp];
  const sx=(t.x-cam.x)*cam.scale+W/2, sy=(t.y-cam.y)*cam.scale+H/2;
  if(sx>50&&sx<W-50&&sy>50&&sy<H-50)return;
  const ang=Math.atan2(sy-H/2,sx-W/2);
  const r=Math.min(W,H)*0.36;
  const ax=W/2+Math.cos(ang)*r, ay=H/2+Math.sin(ang)*r;
  ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);
  ctx.fillStyle='rgba(110,210,255,0.92)';
  ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();
  ctx.restore();
}

const mm=document.getElementById('minimap'), mctx=mm.getContext('2d');
function fmt(ms){
  ms=Math.max(0,ms);
  const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),t=Math.floor(ms%1000);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(t).padStart(3,'0');
}
function updateHUD(){
  if(!player)return;
  const k=player.kmh();
  document.getElementById('spd').innerHTML=k+'<small> KM/H</small>';
  document.getElementById('gear').textContent='GEAR '+(k<40?1:k<90?2:k<140?3:k<185?4:5);
  document.querySelector('#sbar i').style.width=Math.min(100,k/2.2)+'%';
  document.getElementById('lapl').textContent=Math.min(player.lap+1,LAPS);
  document.getElementById('cp').textContent=(player.cp===0?CPS.length:player.cp)+'/'+CPS.length;
  document.getElementById('time').textContent=fmt(raceOver?finishedTime:performance.now()-startTime);
  document.getElementById('ppos').textContent='POSITION '+player.place+' / 2';
  drawMinimap();
}
function drawMinimap(){
  const S=180,k=S/WORLD;
  mctx.clearRect(0,0,S,S);
  mctx.fillStyle='rgba(8,11,18,0.85)';mctx.fillRect(0,0,S,S);
  mctx.fillStyle='rgba(52,60,74,0.9)';
  for(let i=0;i<GN;i++)for(let j=0;j<GN;j++){
    const x=(i*TILE+ROADW)*k,y=(j*TILE+ROADW)*k,s2=(TILE-ROADW)*k;
    mctx.fillStyle=isPark(i,j)?'rgba(43,74,51,0.95)':'rgba(52,60,74,0.95)';
    mctx.fillRect(x,y,s2,s2);
  }
  mctx.strokeStyle='rgba(110,210,255,0.5)';mctx.lineWidth=2;mctx.beginPath();
  CPS.forEach((c,i)=>{const x=c.x*k,y=c.y*k;i?mctx.lineTo(x,y):mctx.moveTo(x,y);});
  mctx.lineTo(CPS[0].x*k,CPS[0].y*k);mctx.stroke();
  for(const a of all){mctx.fillStyle=a.isPlayer?'#6ed2ff':'#ff8c5a';
    mctx.beginPath();mctx.arc(a.x*k,a.y*k,a.isPlayer?5:4,0,6.283);mctx.fill();}
}

document.querySelectorAll('.char').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    chosen=el.dataset.char;
  });
});
document.querySelector('[data-char="ini"]').classList.add('sel');
document.getElementById('start').addEventListener('click',startRace);
document.getElementById('again').addEventListener('click',startRace);
document.getElementById('mute').addEventListener('click',toggleMute);

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(running){
    countdown-=dt;
    if(countdown>-0.9)showCount();else center.style.opacity=0;
    if(countdown<=0){
      player.update(dt,throttleInput(),steerInput());
      const a=aiControl();ai.update(dt,a.th,a.steer);
      for(const c of all){
        if(collideCar(c))addSparks(c.x,c.y,10);
        addSkid(c);addSmoke(c);checkProgress(c);
      }
      updParticles(dt);updatePositions();
      if(player.finished&&!raceOver){
        raceOver=true;finishedTime=performance.now()-startTime;
        player.place=ai.finished?2:1;ai.place=player.place===1?2:1;
        endRace();
      }
    }
  }
  updateCamera(dt);audioUpdate();render();
  if(player)updateHUD();
  requestAnimationFrame(frame);
}

genCity();makeCars();
cam={x:player.x,y:player.y,scale:baseScale()};
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
